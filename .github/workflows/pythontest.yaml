name: Pytest

on:
  workflow_dispatch:

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - '**'
    paths:
      - 'qupulse_mfli/**'
      - 'tests/**'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  run:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up latest stable Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true

      - name: Show Python version
        run: python --version

      - name: Install Hatch
        run: python -m pip install hatch

      - name: Run tests
        run: python -m hatch run test